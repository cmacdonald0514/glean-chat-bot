[project]
name = "glean-chat-bot"
version = "0.1.0"
description = "Grounded question answering over local documents, via Glean's Search, Chat and Indexing APIs."
requires-python = ">=3.12,<4.0"
dependencies = [
    "glean-api-client>=0.16.0",
    "mcp>=2.0.0",
    "pydantic>=2.13",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "pypdf>=6.0.0",
    "python-dotenv>=1.2.0",
    # Transitive via mcp, but named because __main__.py imports it directly for
    # the /healthz route.
    "starlette>=1.6",
]

[project.scripts]
glean-index = "glean_chat_bot.indexing.cli:main"
glean-mcp = "glean_chat_bot.__main__:main"

[tool.poetry.group.dev.dependencies]
ruff = "^0.14"
pytest = "^8.4"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET"]
# SIM905 would flatten the STOP_WORDS block into one 400-char list literal.
ignore = ["SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default run is the offline tier: no network, no tokens. `pytest -m live`
# overrides this and runs the eval set against the real Glean instance.
addopts = "-m 'not live'"
markers = [
    "live: hits the real Glean API; needs GLEAN_CLIENT_TOKEN and an indexed corpus",
]
