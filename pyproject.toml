[project]
name = "glean-chat-bot"
version = "0.1.0"
description = "Grounded question answering over local documents, via Glean's Search, Chat and Indexing APIs."
requires-python = ">=3.12,<4.0"
dependencies = [
    "glean-api-client>=0.16.0",
    "mcp>=2.0.0",
    "pydantic>=2.13",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "pypdf>=6.0.0",
    "python-dotenv>=1.2.0",
]

[project.scripts]
glean-index = "glean_chat_bot.indexing:main"

[tool.poetry.group.dev.dependencies]
ruff = "^0.14"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET"]
# SIM905 would flatten the STOP_WORDS block into one 400-char list literal.
ignore = ["SIM905"]
